name: Deploy to Azure Static Web Apps

# Deploys main to production and gives every pull request a preview URL.
# Needs one repository secret: AZURE_STATIC_WEB_APPS_API_TOKEN (see README).
# Until that secret exists, the deploy steps are skipped instead of failing.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check for deployment token
        id: token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set, skipping deploy."; fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
      - name: Build and deploy
        if: steps.token.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Next.js hybrid rendering: the API route runs as a managed function.
          app_location: /
          api_location: ""
          output_location: ""

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check for deployment token
        id: token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - name: Close preview environment
        if: steps.token.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
